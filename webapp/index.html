<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    CSP notes:
    - script-src 'self' (no 'unsafe-inline') — blocks the dominant XSS vector.
    - style-src keeps 'unsafe-inline' because several pages use inline style={}
      attributes. CSS-only injection is materially less dangerous than JS
      injection; tightening this further requires refactoring those components.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    connect-src 'self';
    font-src 'self';
    form-action 'self';
    base-uri 'self';
  " />

    <link rel="icon" type="image/svg+xml" href="/nodewarden-logo-bg.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/boot.css" />

    <title>NodeWarden</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <div class="boot-card" aria-label="Loading NodeWarden">
          <img class="boot-logo" src="/nodewarden-logo.svg" alt="" />
          <div class="boot-line"></div>
          <div class="boot-line short"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
